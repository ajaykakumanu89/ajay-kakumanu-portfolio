name: Publish portfolio

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'ABOUT.md'
      - 'resume.md'
      - 'samples/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependency without install scripts
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static pages
        working-directory: site
        run: npm run build
      - name: Check pages, links, and content boundaries
        working-directory: site
        run: npm run check
      - name: Upload only generated static output
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
